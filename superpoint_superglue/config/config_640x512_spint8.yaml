superpoint:
  max_keypoints: 500
  keypoint_threshold: 0.004
  remove_borders: 4
  input_tensor_names:
    - "input"
  output_tensor_names:
    - "scores"
    - "descriptors"
  onnx_file: "superpoint_v1_sim_int32_trt10.onnx"
  engine_file: "superpoint_v1_int8.engine"
  use_int8: true
  calib_width: 640
  calib_height: 480
  calib_image_dir: "calib_superpoint"
  calib_cache_file: "superpoint_v1_int8.calib"
  dla_core: -1

superglue:
  image_width: 640
  image_height: 512
  input_tensor_names:
    - "keypoints_0"
    - "scores_0"
    - "descriptors_0"
    - "keypoints_1"
    - "scores_1"
    - "descriptors_1"
  output_tensor_names:
    - "scores"
  onnx_file: "superglue_indoor_sim_int32_trt10.onnx"
  engine_file: "superglue_indoor_fp16_stable.engine"
  dla_core: -1
